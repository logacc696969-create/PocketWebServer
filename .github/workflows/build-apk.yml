name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giai nen file zip nguon (repo chi luu file zip, khong checkin source truc tiep)
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "LOI: khong tim thay file .zip nao o goc repo. Cac file hien co:" >&2
            ls -la >&2
            exit 1
          fi
          echo "Tim thay file zip nguon: $ZIP_FILE"

          EXTRACT_DIR="$RUNNER_TEMP/source-extracted"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          ENTRIES=$(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1)
          ENTRY_COUNT=$(printf '%s\n' "$ENTRIES" | grep -c .)
          if [ "$ENTRY_COUNT" -eq 1 ] && [ -d "$ENTRIES" ]; then
            echo "Zip co 1 thu muc con boc ngoai ($ENTRIES) - nhay vao trong do"
            SRC_DIR="$ENTRIES"
          else
            SRC_DIR="$EXTRACT_DIR"
          fi

          echo "Copy noi dung tu $SRC_DIR ra goc repo..."
          cp -a "$SRC_DIR"/. .

      - name: Xac nhan cau truc sau khi giai nen (co the xoa buoc nay sau khi build on dinh)
        run: |
          echo "=== scripts/ da xuat hien chua ==="
          ls -la scripts/ 2>&1 || echo "VAN CHUA CO scripts/ - kiem tra lai cau truc file zip"
          echo ""
          echo "=== Toan bo cay thu muc goc, toi da 2 cap (bo qua .git) ==="
          find . -maxdepth 2 -not -path './.git*' | sort

      - name: Cai dat JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai dat Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE_BIN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -d "$CMDLINE_BIN" ]; then
            VERSIONED_DIR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 1 -type d -regex '.*/[0-9][0-9.]*' | sort -V | tail -1)
            CMDLINE_BIN="$VERSIONED_DIR/bin"
          fi
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"

      - name: Dam bao co platform 34 + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Cai dat Gradle (khong dung wrapper checked-in)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Doc site.config.json
        id: cfg
        run: |
          echo "runtime=$(jq -r '.runtime' site.config.json)" >> "$GITHUB_OUTPUT"

      - name: Chuan bi runtime + website (${{ steps.cfg.outputs.runtime }}) - arm64
        run: |
          chmod +x scripts/runtimes/*.sh scripts/lib/*.sh scripts/prepare_cloudflared.sh
          RUNTIME="${{ steps.cfg.outputs.runtime }}"
          bash "scripts/runtimes/${RUNTIME}.sh" aarch64 ./runtime-out-arm64
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp ./runtime-out-arm64/*.so app/src/main/jniLibs/arm64-v8a/
          cp ./runtime-out-arm64/www.zip app/src/main/assets/www.zip
          cp ./runtime-out-arm64/runtime.json app/src/main/assets/runtime.json

      - name: Chuan bi runtime cho armeabi-v7a (may cu 32-bit, khong bat buoc)
        continue-on-error: true
        run: |
          RUNTIME="${{ steps.cfg.outputs.runtime }}"
          bash "scripts/runtimes/${RUNTIME}.sh" arm ./runtime-out-armv7
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp ./runtime-out-armv7/*.so app/src/main/jniLibs/armeabi-v7a/

      - name: Tai cloudflared cho arm64-v8a
        run: |
          bash scripts/prepare_cloudflared.sh arm64 ./cfd-out-arm64
          cp ./cfd-out-arm64/libcfd.so app/src/main/jniLibs/arm64-v8a/

      - name: Tai cloudflared cho armeabi-v7a (khong bat buoc)
        continue-on-error: true
        run: |
          bash scripts/prepare_cloudflared.sh arm ./cfd-out-armv7
          cp ./cfd-out-armv7/libcfd.so app/src/main/jniLibs/armeabi-v7a/

      - name: Build APK (debug, chua ky - de cai thu / test)
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wp-pocket-server-debug-apk
          path: app/build/outputs/apk/debug/*.apk
